<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRVSPORTINFO</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#070a10;
color:#fff;
}
header{
background:#101722;
padding:20px;
text-align:center;
border-bottom:1px solid #263041;
}
header h1{margin:0;font-size:30px}
header span{color:#55dfff}
.container{max-width:1100px;margin:auto;padding:18px}
.card{
background:#111824;
border:1px solid #273142;
border-radius:18px;
padding:18px;
margin-bottom:16px;
}
button{
border:0;
border-radius:11px;
padding:11px 14px;
margin:4px;
background:#222d3e;
color:white;
font-weight:bold;
cursor:pointer;
}
button:hover{background:#304057}
.primary{background:#55dfff;color:#061018}
.danger{background:#7e2638}
.green{background:#16734b}
.tabs{display:flex;gap:8px}
.tabs button{flex:1}
.active{background:#55dfff!important;color:#061018!important}
input,select{
width:100%;
padding:12px;
margin:5px 0;
border-radius:10px;
border:1px solid #303c50;
background:#0a1018;
color:#fff;
}
.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
}
.players{
display:flex;
flex-wrap:wrap;
gap:7px;
margin-top:8px;
}
.player{
background:#222d3e;
padding:7px 11px;
border-radius:20px;
}
.score{
font-size:48px;
font-weight:bold;
text-align:center;
margin:10px;
}
.center{text-align:center}
.controls{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:7px;
}
.event{
padding:10px;
border-bottom:1px solid #263041;
}
.stat{
display:flex;
justify-content:space-between;
padding:9px;
border-bottom:1px solid #263041;
}
.hidden{display:none!important}
.badge{
display:inline-block;
padding:5px 9px;
border-radius:20px;
background:#243044;
margin:3px;
font-size:13px;
}
@media(max-width:700px){
.grid{grid-template-columns:1fr}
.controls{grid-template-columns:repeat(2,1fr)}
.score{font-size:38px}
}
</style>
</head>

<body>

<header>
<h1>GRV<span>SPORTINFO</span></h1>
<p>Football & Cricket Match Manager</p>
</header>

<div class="container">

<!-- SETUP -->

<section id="setup" class="card">

<h2>Choose Sport</h2>

<div class="tabs">
<button id="footballTab" class="active">⚽ Football</button>
<button id="cricketTab">🏏 Cricket</button>
</div>

<h2>Match Setup</h2>

<div class="grid">
<div>
<label>Team A</label>
<input id="teamA" value="Team A">
</div>

<div>
<label>Team B</label>
<input id="teamB" value="Team B">
</div>
</div>

<div id="oversSetup" class="hidden">
<label>Overs per innings</label>
<input id="totalOvers" type="number" min="1" value="10">
</div>

<div class="grid">

<div>
<h3>Team A Players</h3>
<input id="playerAInput" placeholder="Player name">
<button onclick="addPlayer('A')">➕ Add Player</button>
<div id="playersA" class="players"></div>
</div>

<div>
<h3>Team B Players</h3>
<input id="playerBInput" placeholder="Player name">
<button onclick="addPlayer('B')">➕ Add Player</button>
<div id="playersB" class="players"></div>
</div>

</div>

<br>

<button class="primary" onclick="startMatch()">
▶ START MATCH
</button>

</section>


<!-- MATCH -->

<section id="match" class="hidden">

<div class="card center">

<h2 id="matchTitle"></h2>

<div id="mainScore" class="score">
0 - 0
</div>

<p id="matchStatus"></p>

</div>


<!-- FOOTBALL -->

<div id="footballPanel">

<div class="card">

<h2>⚽ Football Events</h2>

<label>Team</label>
<select id="footballTeam"></select>

<label>Player</label>
<select id="footballPlayer"></select>

<label>Assist (optional)</label>
<select id="assistPlayer"></select>

<div class="controls">

<button onclick="footballGoal(1)">⚽ + Goal</button>
<button onclick="footballGoal(-1)">⚽ - Goal</button>

<button onclick="footballEvent('Assist')">
🎯 Assist
</button>

<button onclick="footballEvent('Foul')">
🚫 Foul
</button>

<button onclick="footballEvent('Yellow Card')">
🟨 Yellow
</button>

<button onclick="footballEvent('Red Card')">
🟥 Red
</button>

<button onclick="footballEvent('Corner')">
🚩 Corner
</button>

</div>

</div>


<div class="card">

<h2>👥 Football Player Stats</h2>

<div id="footballStats"></div>

</div>

</div>


<!-- CRICKET -->

<div id="cricketPanel" class="hidden">

<div class="card center">

<h2 id="inningsTitle">1st Innings</h2>

<div id="cricketScore" class="score">
0 / 0
</div>

<p id="oversDisplay">Overs: 0.0</p>

</div>


<div class="card">

<h3>Current Players</h3>

<div class="grid">

<div>
<label>Striker</label>
<select id="striker"></select>
</div>

<div>
<label>Non-Striker</label>
<select id="nonStriker"></select>
</div>

</div>

<label>Bowler</label>
<select id="bowler"></select>

</div>


<div class="card">

<h2>🏏 Ball</h2>

<div class="controls">

<button onclick="cricketBall(0)">Dot</button>
<button onclick="cricketBall(1)">+1</button>
<button onclick="cricketBall(2)">+2</button>
<button onclick="cricketBall(3)">+3</button>
<button onclick="cricketBall(4)">FOUR</button>
<button onclick="cricketBall(6)">SIX</button>

<button onclick="cricketExtra('wide')">
Wide
</button>

<button onclick="cricketExtra('no-ball')">
No Ball
</button>

<button onclick="cricketExtra('bye')">
Bye
</button>

<button onclick="cricketExtra('leg-bye')">
Leg Bye
</button>

<button onclick="cricketWicket('Wicket')">
🏏 Wicket
</button>

<button onclick="cricketWicket('LBW')">
LBW
</button>

</div>

<br>

<button onclick="changeRuns(-1)">➖ Decrease Run</button>
<button onclick="changeRuns(1)">➕ Increase Run</button>

<br>

<button onclick="changeWicket(-1)">
➖ Decrease Wicket
</button>

<button onclick="changeWicket(1)">
➕ Increase Wicket
</button>

</div>


<div class="card">

<h2>📊 Current Batting</h2>
<div id="battingStats"></div>

</div>


<div class="card">

<h2>🎯 Bowling</h2>
<div id="bowlingStats"></div>

</div>


<div class="card center">

<button class="green" onclick="endInnings()">
🏁 END INNINGS
</button>

</div>

</div>


<!-- EVENTS -->

<div class="card">

<h2>📋 Match Timeline</h2>

<div id="events">
No events yet.
</div>

</div>


<div class="card center">

<button class="danger" onclick="finishMatch()">
🏆 FINISH MATCH
</button>

<button onclick="location.reload()">
🔄 NEW MATCH
</button>

</div>

</section>


<!-- HISTORY -->

<section class="card">

<h2>📚 Match History</h2>

<div id="history"></div>

</section>

</div>


<script>

let sport="football";

let players={
A:[],
B:[]
};

let game=null;

let history=
JSON.parse(localStorage.getItem("grvHistory")||"[]");


/* SPORT */

document.getElementById("footballTab").onclick=()=>{
sport="football";

footballTab.classList.add("active");
cricketTab.classList.remove("active");

oversSetup.classList.add("hidden");
};

document.getElementById("cricketTab").onclick=()=>{
sport="cricket";

cricketTab.classList.add("active");
footballTab.classList.remove("active");

oversSetup.classList.remove("hidden");
};


/* PLAYERS */

function addPlayer(team){

let input=document.getElementById(
team==="A"?"playerAInput":"playerBInput"
);

let name=input.value.trim();

if(!name)return;

players[team].push({
name:name,
goals:0,
assists:0,
fouls:0,
yellow:0,
red:0,
corners:0,
runs:0,
balls:0,
fours:0,
sixes:0,
wickets:0
});

input.value="";

renderPlayers();

}

function renderPlayers(){

playersA.innerHTML=
players.A.map(p=>
`<span class="player">👤 ${escape(p.name)}</span>`
).join("");

playersB.innerHTML=
players.B.map(p=>
`<span class="player">👤 ${escape(p.name)}</span>`
).join("");

}


/* START */

function startMatch(){

game={
teamA:teamA.value.trim()||"Team A",
teamB:teamB.value.trim()||"Team B",

scoreA:0,
scoreB:0,

innings:1,

runs:[0,0],
wickets:[0,0],
balls:[0,0],

events:[],

totalOvers:+totalOvers.value||10
};

setup.classList.add("hidden");
match.classList.remove("hidden");

if(sport==="football"){

footballPanel.classList.remove("hidden");
cricketPanel.classList.add("hidden");

}

else{

footballPanel.classList.add("hidden");
cricketPanel.classList.remove("hidden");

prepareCricket();

}

update();

}


/* FOOTBALL */

function footballGoal(change){

let team=
document.getElementById("footballTeam").value;

let index=team==="A"?0:1;

if(change===1){

game["score"+team]++;

let player=getFootballPlayer();

if(player)player.goals++;

let assist=getAssistPlayer();

if(assist)assist.assists++;

game.events.unshift(
"⚽ GOAL — "+
player?.name+
(assist?" 🎯 Assist: "+assist.name:"")
);

}

else{

if(game["score"+team]>0)
game["score"+team]--;

let player=getFootballPlayer();

if(player && player.goals>0)
player.goals--;

game.events.unshift(
"➖ Goal removed — "+(player?.name||"")
);

}

update();

}

function footballEvent(type){

let player=getFootballPlayer();

if(!player)return;

if(type==="Assist")player.assists++;
if(type==="Foul")player.fouls++;
if(type==="Yellow Card")player.yellow++;
if(type==="Red Card")player.red++;
if(type==="Corner")player.corners++;

game.events.unshift(
type+" — "+player.name
);

update();

}

function getFootballPlayer(){

let team=document.getElementById("footballTeam").value;

let id=document.getElementById("footballPlayer").value;

return players[team][id];

}

function getAssistPlayer(){

let team=document.getElementById("footballTeam").value;

let id=document.getElementById("assistPlayer").value;

return players[team][id];

}


/* CRICKET */

function prepareCricket(){

let batting=game.innings===1?"A":"B";
let bowling=game.innings===1?"B":"A";

striker.innerHTML=
players[batting].map((p,i)=>
`<option value="${i}">${escape(p.name)}</option>`
).join("");

nonStriker.innerHTML=
striker.innerHTML;

bowler.innerHTML=
players[bowling].map((p,i)=>
`<option value="${i}">${escape(p.name)}</option>`
).join("");

}

function currentBatter(){

let batting=game.innings===1?"A":"B";

return players[batting][
document.getElementById("striker").value
];

}

function currentBowler(){

let bowling=game.innings===1?"B":"A";

return players[bowling][
document.getElementById("bowler").value
];

}


function cricketBall(runs){

let batter=currentBatter();
let bowler=currentBowler();

if(!batter)return;

game.runs[game.innings-1]+=runs;
game.balls[game.innings-1]++;

batter.runs+=runs;
batter.balls++;

if(runs===4)batter.fours++;
if(runs===6)batter.sixes++;

if(bowler){
bowler.runs+=runs;
}

game.events.unshift(
`${runs===0?"•":runs} run — ${batter.name}`
);

update();

}


function cricketExtra(type){

let batter=currentBatter();
let bowler=currentBowler();

game.runs[game.innings-1]++;
game.events.unshift(
type.toUpperCase()+" — "+(batter?.name||"")
);

if(type==="wide"||type==="no-ball"){

if(bowler)bowler.runs++;

}

else{

game.balls[game.innings-1]++;

}

update();

}


function cricketWicket(type){

let batter=currentBatter();
let bowler=currentBowler();

game.wickets[game.innings-1]++;

game.balls[game.innings-1]++;

if(batter)batter.balls++;

if(bowler)bowler.wickets++;

game.events.unshift(
"❌ "+type+" — "+(batter?.name||"")
);

update();

}


/* DECREASE / INCREASE */

function changeRuns(amount){

let i=game.innings-1;

if(amount<0 && game.runs[i]<=0)return;

game.runs[i]+=amount;

if(game.runs[i]<0)
game.runs[i]=0;

game.events.unshift(
amount>0?"➕ Run added":"➖ Run removed"
);

update();

}


function changeWicket(amount){

let i=game.innings-1;

if(amount<0 && game.wickets[i]<=0)return;

game.wickets[i]+=amount;

if(game.wickets[i]<0)
game.wickets[i]=0;

game.events.unshift(
amount>0?"➕ Wicket added":"➖ Wicket removed"
);

update();

}


/* INNINGS */

function endInnings(){

if(game.innings===1){

game.innings=2;

prepareCricket();

game.events.unshift(
"🏁 1st innings ended"
);

update();

}

else{

alert("Both innings are complete.");

}

}


/* UPDATE */

function update(){

matchTitle.innerText=
game.teamA+" vs "+game.teamB;

if(sport==="football"){

mainScore.innerText=
game.scoreA+" - "+game.scoreB;

matchStatus.innerText="Football";

renderFootball();

}

else{

let i=game.innings-1;

let overs=
Math.floor(game.balls[i]/6)+
"."+
(game.balls[i]%6);

inningsTitle.innerText=
game.innings===1?
"1st Innings — "+game.teamA:
"2nd Innings — "+game.teamB;

cricketScore.innerText=
game.runs[i]+" / "+game.wickets[i];

oversDisplay.innerText=
"Overs: "+overs+" / "+game.totalOvers;

renderBatting();
renderBowling();

}

renderEvents();

}


/* FOOTBALL UI */

function renderFootball(){

let team=
footballTeam.value;

footballPlayer.innerHTML=
players[team].map((p,i)=>
`<option value="${i}">
${escape(p.name)}
</option>`
).join("");

assistPlayer.innerHTML=
`<option value="">No assist</option>`+
players[team].map((p,i)=>
`<option value="${i}">
${escape(p.name)}
</option>`
).join("");

footballTeam.innerHTML=`
<option value="A">${escape(game.teamA)}</option>
<option value="B">${escape(game.teamB)}</option>
`;

}

function renderFootballStats(){

let html="";

["A","B"].forEach(team=>{

html+=`<h3>${escape(
team==="A"?game.teamA:game.teamB
)}</h3>`;

players[team].forEach(p=>{

html+=`
<div class="stat">
<span>${escape(p.name)}</span>
<span>
⚽ ${p.goals}
🎯 ${p.assists}
🚫 ${p.fouls}
🟨 ${p.yellow}
🟥 ${p.red}
</span>
</div>`;

});

});

footballStats.innerHTML=html;

}


/* CRICKET STATS */

function renderBatting(){

let team=
game.innings===1?"A":"B";

let html="";

players[team].forEach(p=>{

html+=`
<div class="stat">
<span>${escape(p.name)}</span>
<span>
${p.runs} runs |
${p.balls} balls |
4s: ${p.fours} |
6s: ${p.sixes}
</span>
</div>`;

});

battingStats.innerHTML=html;

}


function renderBowling(){

let team=
game.innings===1?"B":"A";

let html="";

players[team].forEach(p=>{

html+=`
<div class="stat">
<span>${escape(p.name)}</span>
<span>
Wickets: ${p.wickets} |
Runs: ${p.runs}
</span>
</div>`;

});

bowlingStats.innerHTML=html;

}


/* EVENTS */

function renderEvents(){

events.innerHTML=
game.events.length?

game.events.map((e,i)=>
`<div class="event">
${i+1}. ${escape(e)}
</div>`
).join("")

:"No events yet.";

}


/* FINISH */

function finishMatch(){

let result;

if(sport==="football"){

result=
game.teamA+" "+game.scoreA+
" - "+
game.scoreB+" "+game.teamB;

}

else{

result=
game.teamA+" "+game.runs[0]+"/"+
game.wickets[0]+
" | "+
game.teamB+" "+game.runs[1]+"/"+
game.wickets[1];

}

history.unshift({

sport:sport,
match:game.teamA+" vs "+game.teamB,
score:result,
date:new Date().toLocaleString()

});

localStorage.setItem(
"grvHistory",
JSON.stringify(history)
);

alert("Match saved successfully 🔥");

renderHistory();

}


function renderHistory(){

historyBox.innerHTML=
history.length?

history.map(x=>
`<div class="event">
<b>${x.sport==="football"?"⚽":"🏏"}
${escape(x.match)}</b><br>
${escape(x.score)}<br>
<small>${escape(x.date)}</small>
</div>`
).join("")

:"No saved matches.";

}


/* ESCAPE */

function escape(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* HISTORY */

let historyBox=document.getElementById("history");

renderHistory();

</script>

</body>
</html>
